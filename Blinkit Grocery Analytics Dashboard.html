<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blinkit Grocery Analytics</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF9E3;--card:#fff;--ink:#17301C;--mute:#5E7261;--line:#EBE3BC;--y:#F8CB46;--g:#0C831F;--g2:#085A15;--onhero:#F8CB46;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1A11;--card:#162A1A;--ink:#F2F6EC;--mute:#9DB5A0;--line:#264130;--g:#1FA33A;--g2:#0C5A1B}}
:root[data-theme="dark"]{--bg:#0E1A11;--card:#162A1A;--ink:#F2F6EC;--mute:#9DB5A0;--line:#264130;--g:#1FA33A;--g2:#0C5A1B}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Outfit',system-ui,sans-serif}
header{background:var(--g2);color:#fff;padding:18px 24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border-bottom:5px solid var(--y)}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.01em}h1 b{background:var(--y);color:var(--g2);padding:0 9px;border-radius:7px;margin-right:8px}
header p{margin:2px 0 0;font-size:13px;opacity:.8}
button.reset{font:inherit;font-weight:600;background:var(--y);color:var(--g2);border:0;border-radius:20px;padding:8px 18px;cursor:pointer}
main{padding:16px 24px 28px;max-width:1400px;margin:auto}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:2px solid var(--line);border-left:7px solid var(--y);border-radius:12px;padding:12px 16px}
.kpi:focus-visible,.row:focus-visible,[data-k]:focus-visible{outline:3px solid var(--g);outline-offset:2px}
.kpi small{display:block;font-size:13px;color:var(--mute);font-weight:500}.kpi strong{font-size:30px;font-weight:800}
.kpi.on{background:var(--g);border-color:var(--g);border-left-color:var(--y)}.kpi.on small{color:#dff5d8}.kpi.on strong{color:var(--onhero)}
.chips{min-height:34px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0;font-size:13px;color:var(--mute)}
.chip{background:var(--y);color:#17301C;border:0;border-radius:16px;padding:4px 11px;font:inherit;font-weight:600;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.card h2{margin:0 0 10px;font-size:15px;font-weight:700}.card h2 span{color:var(--mute);font-weight:500}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c7{grid-column:span 7}.c12{grid-column:span 12}
.donut{display:flex;align-items:center;gap:14px}.donut svg{width:150px;flex:none}
.leg{flex:1;font-size:13px}.leg div{display:flex;align-items:center;gap:7px;padding:4px 0;cursor:pointer}
.leg i{width:11px;height:11px;border-radius:3px;flex:none}.leg em{margin-left:auto;font-style:normal;font-weight:700}
[data-k]{cursor:pointer;transition:opacity .15s}.dim{opacity:.28}
.row{display:grid;grid-template-columns:128px 1fr 58px;gap:8px;align-items:center;font-size:12.5px;padding:2.5px 0}
.row .t{background:var(--bg);border-radius:5px;height:15px}.row .t i{display:block;height:100%;border-radius:5px;background:var(--y)}
.row.sel .t i{background:var(--g)}.row.sel{font-weight:700}.row b{text-align:right}
.cols{display:flex;align-items:flex-end;gap:8px;height:285px;padding-top:6px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:12px;min-width:0}
.col i{display:block;width:100%;background:var(--y);border-radius:6px 6px 0 0}.col.sel i{background:var(--g)}.col b{font-size:11.5px;margin-bottom:3px}.col span{color:var(--mute);margin-top:5px}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:620px}
th{background:var(--g2);color:#fff;text-align:right;padding:9px 12px;font-weight:600}th:first-child,td:first-child{text-align:left}
td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line)}tr[data-k]:hover td{background:var(--bg)}tr.sel td{background:var(--y);color:#17301C;font-weight:700}
tfoot td{font-weight:800;border-top:2px solid var(--g);border-bottom:0}
.bar{display:inline-block;height:9px;background:var(--g);border-radius:4px;vertical-align:middle;margin-right:7px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.c4,.c5,.c7{grid-column:span 12}main{padding:12px}}
</style></head><body>
<header><div><h1><b>blinkit</b>Grocery Analytics</h1><p id="sub"></p></div><button class="reset" id="rs">Clear all filters</button></header>
<main>
<div class="kpis" id="kpis"></div>
<div class="chips" id="chips"></div>

<section class="card c5"><h2>Item type <span class="ml"></span></h2><div id="type"></div></section>
<section class="card c7"><h2>Outlet establishment year <span class="ml"></span></h2><div class="cols" id="year"></div></section>
<section class="card c12"><h2>Outlet type scorecard</h2><div class="scroll"><table id="tbl"></table></div></section>
</div></main>
